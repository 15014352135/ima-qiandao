name: ima 凭证恢复（扫码）

on:
  workflow_dispatch:

concurrency:
  group: ima-recover
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 恢复旧凭证（可能不存在 -> 全新初始化模式，扫码后自动生成）
      - name: 恢复凭证缓存
        uses: actions/cache/restore@v4
        with:
          path: credentials.json
          key: ima-cred-${{ github.run_id }}
          restore-keys: |
            ima-cred-

      - name: 生成二维码并发送邮件，等待扫码
        env:
          IMA_SMTP_HOST: ${{ secrets.IMA_SMTP_HOST }}
          IMA_SMTP_PORT: ${{ secrets.IMA_SMTP_PORT }}
          IMA_SMTP_USER: ${{ secrets.IMA_SMTP_USER }}
          IMA_SMTP_PASS: ${{ secrets.IMA_SMTP_PASS }}
          IMA_MAIL_TO: ${{ secrets.IMA_MAIL_TO }}
        run: |
          if [ -z "$IMA_SMTP_HOST" ] || [ -z "$IMA_SMTP_USER" ] || [ -z "$IMA_SMTP_PASS" ]; then
            echo "::error::需要配置 Secrets: IMA_SMTP_HOST / IMA_SMTP_PORT / IMA_SMTP_USER / IMA_SMTP_PASS"
            exit 1
          fi
          MAIL_TO="${IMA_MAIL_TO:-$IMA_SMTP_USER}"
          echo "二维码收件人: $MAIL_TO（发件账号: $IMA_SMTP_USER）"
          python ima_recover.py --to "$MAIL_TO" --timeout 720

      # 扫码成功才会写入新凭证，内容变化 -> 新缓存条目；若凭证本就有效(脚本直接退出)，缓存已存在，重复保存失败可忽略
      - name: 保存凭证缓存
        if: always() && hashFiles('credentials.json') != ''
        uses: actions/cache/save@v4
        with:
          path: credentials.json
          key: ima-cred-${{ hashFiles('credentials.json') }}
        continue-on-error: true

      - name: 验证签到状态
        run: python ima_checkin.py --dry-run

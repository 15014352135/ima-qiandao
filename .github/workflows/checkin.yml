name: ima 每日签到

on:
  schedule:
    # 北京时间每天 07:00（UTC 23:00，即前一天 23 点）
    # GitHub 定时任务有 1~4 小时平台延迟，07:00 触发可确保当天上午完成签到；
    # 定时任务时区固定 UTC，不能写北京时间，必须换算成 UTC 23:00。
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ima-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 仅用于 git 提交时间戳等 shell 侧行为；
      # 脚本内部的"今天/星期几"已用固定 UTC+8 判断，不依赖本变量。
      TZ: Asia/Shanghai
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 凭证持久化在 Actions Cache 中：不属于 git 仓库、外部没有下载端点，
      # 仓库保持公开也不泄露（与 Rainyun-Qiandao 缓存 cookie 同款方案）
      - name: 恢复凭证缓存
        uses: actions/cache/restore@v4
        with:
          path: credentials.json
          key: ima-cred-${{ github.run_id }}
          restore-keys: |
            ima-cred-

      - name: 兜底：从旧版 IMA_CREDENTIALS Secret 迁移凭证（如有）
        env:
          IMA_CREDENTIALS: ${{ secrets.IMA_CREDENTIALS }}
        run: |
          if [ ! -f credentials.json ] && [ -n "$IMA_CREDENTIALS" ]; then
            printf '%s' "$IMA_CREDENTIALS" > credentials.json
            echo "已从 IMA_CREDENTIALS Secret 迁移凭证，后续将持久化在 Actions 缓存中"
          fi

      - name: 检查凭证
        run: |
          if [ ! -f credentials.json ]; then
            echo "::error::还没有凭证，请先运行「ima 凭证恢复（扫码）」工作流完成授权"
            exit 1
          fi

      - name: 执行签到
        id: run
        continue-on-error: true
        run: python ima_checkin.py --json > result.json 2> checkin.err

      - name: 记录结果并提交
        if: always()
        run: |
          line="$(head -n1 result.json 2>/dev/null || true)"
          if [ -z "$line" ]; then
            err="$(head -n1 checkin.err 2>/dev/null | tr -d '"' || true)"
            line="{\"date\":\"$(date -u +%F)\",\"error\":\"${err:-run failed, see workflow log}\"}"
          fi
          echo "$line" >> history.jsonl
          rm -f checkin.err result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.jsonl
          git diff --cached --quiet || git commit -m "checkin $(date -u +%F)"
          git push

      # 仅当凭证内容变化（如重新授权）时产生新缓存条目；内容不变则复用已有缓存
      - name: 保存凭证缓存
        if: always() && hashFiles('credentials.json') != ''
        uses: actions/cache/save@v4
        with:
          path: credentials.json
          key: ima-cred-${{ hashFiles('credentials.json') }}
        continue-on-error: true

      - name: 失败时标记任务失败
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::签到执行失败，请检查上方日志；若为凭证失效，重新运行「ima 凭证恢复（扫码）」工作流即可"
          exit 1

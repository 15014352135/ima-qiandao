name: ima 每日签到

on:
  schedule:
    # 北京时间 09:07 与 21:07（UTC 01:07 / 13:07）
    # 双时间点互为兜底：GitHub 定时任务存在平台性延迟，接口幂等可安全重复执行
    - cron: '7 1 * * *'
    - cron: '7 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ima-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 写入凭证
        env:
          IMA_CREDENTIALS: ${{ secrets.IMA_CREDENTIALS }}
        run: |
          if [ -z "$IMA_CREDENTIALS" ]; then
            echo "::error::缺少 IMA_CREDENTIALS Secret，请先在仓库 Settings 中配置"
            exit 1
          fi
          printf '%s' "$IMA_CREDENTIALS" > credentials.json

      - name: 执行签到
        id: run
        continue-on-error: true
        run: python ima_checkin.py --json > result.json 2> checkin.err

      - name: 记录结果并提交
        if: always()
        run: |
          line="$(head -n1 result.json 2>/dev/null || true)"
          if [ -z "$line" ]; then
            err="$(head -n1 checkin.err 2>/dev/null | tr -d '"' || true)"
            line="{\"date\":\"$(date -u +%F)\",\"error\":\"${err:-run failed, see workflow log}\"}"
          fi
          echo "$line" >> history.jsonl
          rm -f credentials.json checkin.err result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.jsonl
          git diff --cached --quiet || git commit -m "checkin $(date -u +%F)"
          git push

      - name: 失败时标记任务失败
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::签到执行失败，请检查上方日志；若为凭证失效，请更新 IMA_CREDENTIALS Secret"
          exit 1

name: ima 每日签到

on:
  schedule:
    # 参考 Sync Upstream 的稳定节奏：集中到凌晨非高峰时段，少设几次反而更稳
    # 北京 01:00（UTC 17:00）主触发 + 北京 06:00（UTC 22:00）兜底
    - cron: '0 17 * * *'
    - cron: '0 22 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ima-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 仅用于 git 提交时间戳等 shell 侧行为；
      # 脚本内部的"今天/星期几"已用固定 UTC+8 判断，不依赖本变量。
      TZ: Asia/Shanghai
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 凭证持久化在 Actions Cache 中：不属于 git 仓库、外部没有下载端点，
      # 仓库保持公开也不泄露（与 Rainyun-Qiandao 缓存 cookie 同款方案）
      - name: 恢复凭证缓存
        uses: actions/cache/restore@v4
        with:
          path: credentials.json
          key: ima-cred-${{ github.run_id }}
          restore-keys: |
            ima-cred-

      - name: 兜底：从旧版 IMA_CREDENTIALS Secret 迁移凭证（如有）
        env:
          IMA_CREDENTIALS: ${{ secrets.IMA_CREDENTIALS }}
        run: |
          if [ ! -f credentials.json ] && [ -n "$IMA_CREDENTIALS" ]; then
            printf '%s' "$IMA_CREDENTIALS" > credentials.json
            echo "已从 IMA_CREDENTIALS Secret 迁移凭证，后续将持久化在 Actions 缓存中"
          fi

      - name: 检查凭证
        run: |
          if [ ! -f credentials.json ]; then
            echo "::error::还没有凭证，请先运行「ima 凭证恢复（扫码）」工作流完成授权"
            exit 1
          fi

      - name: 执行签到
        id: run
        continue-on-error: true
        run: |
          set +e
          python ima_checkin.py --json > result.json 2> checkin.err
          code=$?
          echo "===== 签到结果（stdout） ====="
          cat result.json 2>/dev/null || true
          if [ -s checkin.err ]; then
            echo "===== 错误输出（stderr） ====="
            cat checkin.err
          fi
          echo "退出码: $code"
          exit $code

      - name: 记录结果并提交
        if: always()
        run: |
          line="$(head -n1 result.json 2>/dev/null || true)"
          if [ -z "$line" ]; then
            err="$(head -n1 checkin.err 2>/dev/null | tr -d '"' || true)"
            line="{\"date\":\"$(date -u +%F)\",\"error\":\"${err:-run failed, see workflow log}\"}"
          fi
          echo "$line" >> history.jsonl
          rm -f result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.jsonl
          git diff --cached --quiet || git commit -m "checkin $(date -u +%F)"
          git push

      # 凭证只在扫码授权时变化，签到流程不写回，因此这里不保存缓存
      # （保存由 recover.yml 负责；在内容未变时重复保存只会产生无害但扰人的 warning）

      - name: 输出失败原因与恢复指引
        if: steps.run.outcome == 'failure'
        run: |
          ERR="$(head -n6 checkin.err 2>/dev/null | tr -d '\r' || true)"
          echo "::error::签到失败，具体原因与修复步骤见本次运行的摘要（页面顶部）"
          {
            echo "## ❌ ima 签到失败"
            echo ""
            echo "**错误信息**"
            echo ""
            echo '```'
            echo "${ERR:-未捕获到错误输出，请翻看「执行签到」步骤的日志}"
            echo '```'
            echo ""
            echo "**修复方式**"
            echo ""
            echo "1. 若错误里出现「刷新登录失败 / 登录过期 / 600001」——凭证（refresh token）已失效："
            echo "   打开 Actions → 左侧选「ima 凭证恢复（扫码）」→ Run workflow，"
            echo "   邮箱收到二维码后用微信扫一下并确认，凭证会自动更新，无需其他操作。"
            echo "2. 若提示「找不到 credentials.json」——先运行一次凭证恢复工作流完成授权。"
            echo "3. 若是网络或接口临时异常——稍后重跑即可；连续多次失败请查看上方完整日志。"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
